name: Bug report
description: Report incorrect plugin behaviour
labels: ["bug"]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: vault-version
    attributes:
      label: Vault version
      placeholder: "1.21.4"
    validations:
      required: true
  - type: input
    id: keycloak-version
    attributes:
      label: Keycloak version
      placeholder: "26.6.3"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact vault CLI commands or API calls, in order.
      placeholder: |
        1. vault write keycloak/config ...
        2. vault write keycloak/roles/app ...
        3. vault read keycloak/static-creds/app
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error message or response verbatim.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Vault log lines
      description: >
        See the "Expected logs" section of the README for the messages the
        plugin emits. Redact anything sensitive; never paste passwords or
        tokens.
      render: text
