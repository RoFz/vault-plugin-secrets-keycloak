version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      cooldown-days: 7
    commit-message:
      prefix: 'fix'
    groups:
      go-dependencies:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      cooldown-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
