name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # NOTE: Adopted from HashiCorp vault-workflows-common — detects a missing
      # 'go mod tidy' run, which can leave go.mod/go.sum out of sync.
      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # NOTE: Adopted from HashiCorp vault-workflows-common — enforces consistent
      # Go formatting using gofumpt (a stricter superset of gofmt).
      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          test -z "$(gofumpt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # NOTE: Adopted from HashiCorp vault-workflows-common — builds the plugin
      # binary targeting linux/amd64 (the GitHub Actions runner architecture).
      # The binary is uploaded as an artifact so the integration-test job can
      # use it without recompiling.
      - name: Build plugin binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o bin/vault-plugin-secrets-keycloak \
            ./cmd/vault-plugin-secrets-keycloak

      - name: Upload plugin binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-binary
          path: bin/vault-plugin-secrets-keycloak
          retention-days: 1

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # Outputs SARIF (exits 0 regardless of findings per govulncheck docs).
      - name: Run govulncheck
        run: govulncheck -format sarif ./... > govulncheck.sarif

      # govulncheck emits duplicate CVE IDs in properties.tags, which GitHub's
      # SARIF validator rejects (uniqueItems: true). Deduplicate before upload.
      - name: Deduplicate SARIF tags
        run: |
          jq '.runs[].tool.driver.rules[].properties.tags |= unique' \
            govulncheck.sarif > govulncheck-deduped.sarif
          mv govulncheck-deduped.sarif govulncheck.sarif

      # NOTE: Uploads govulncheck findings to GitHub Code Scanning (Security tab).
      # Skip for fork PRs — GITHUB_TOKEN is read-only there and cannot write
      # to the Security tab. always() ensures we still upload when govulncheck
      # itself exits non-zero (though it's documented to exit 0).
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Download plugin binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/vault-plugin-secrets-keycloak

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120 --junit-xml=results.xml

      - name: Write job summary and PR comment content
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import os

          try:
              tree = ET.parse("results.xml")
              root = tree.getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")

              total    = int(suite.attrib.get("tests", 0))
              failures = int(suite.attrib.get("failures", 0))
              errors   = int(suite.attrib.get("errors", 0))
              skipped  = int(suite.attrib.get("skipped", 0))
              duration = float(suite.attrib.get("time", 0))
              passed   = total - failures - errors - skipped
              failed   = failures + errors
              status   = "PASSED" if failed == 0 else "FAILED"
              icon     = "✅" if failed == 0 else "❌"

              failed_tests = [
                  f"- `{tc.attrib.get('classname', '')}.{tc.attrib.get('name', '')}`"
                  for tc in suite.iter("testcase")
                  if tc.find("failure") is not None or tc.find("error") is not None
              ]

              lines = [
                  f"<details><summary>{icon} Integration Tests — {status} "
                  f"({passed}/{total} passed in {duration:.1f}s)</summary>",
                  "",
                  "| Result | Count |",
                  "|--------|-------|",
                  f"| Passed | {passed} |",
                  f"| Failed | {failed} |",
                  f"| Skipped | {skipped} |",
                  f"| Total | {total} |",
                  f"| Duration | {duration:.1f}s |",
              ]
              if failed_tests:
                  lines += ["", "**Failed tests:**", ""] + failed_tests
              lines += ["", "</details>"]

          except Exception as e:
              lines = [
                  "<details><summary>⚠️ Integration Tests — results unavailable</summary>",
                  "",
                  f"Could not parse results.xml: {e}",
                  "",
                  "</details>",
              ]

          content = "\n".join(lines) + "\n"

          # Write to job summary (visible on the workflow run page).
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(content)

          # Write to a file for the sticky PR comment step.
          with open("pr-comment.md", "w") as f:
              f.write(content)
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: results.xml
          retention-days: 7

      - name: Post PR comment with test results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: integration-test-results
          path: pr-comment.md
