name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # NOTE: Adopted from HashiCorp vault-workflows-common — detects a missing
      # 'go mod tidy' run, which can leave go.mod/go.sum out of sync.
      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # NOTE: Adopted from HashiCorp vault-workflows-common — enforces consistent
      # Go formatting using gofumpt (a stricter superset of gofmt).
      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          test -z "$(gofumpt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout=5m ./...

      # NOTE: Adopted from HashiCorp vault-workflows-common — builds the plugin
      # binary targeting linux/amd64 (the GitHub Actions runner architecture).
      # The binary is uploaded as an artifact so the integration-test job can
      # use it without recompiling.
      - name: Build plugin binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o bin/vault-plugin-secrets-keycloak \
            ./cmd/vault-plugin-secrets-keycloak

      - name: Upload plugin binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-binary
          path: bin/vault-plugin-secrets-keycloak
          retention-days: 1

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # Outputs SARIF (exits 0 regardless of findings per govulncheck docs).
      - name: Run govulncheck
        run: govulncheck -format sarif ./... > govulncheck.sarif

      # govulncheck emits duplicate CVE IDs in properties.tags, which GitHub's
      # SARIF validator rejects (uniqueItems: true). Deduplicate before upload.
      - name: Deduplicate SARIF tags
        run: |
          jq '.runs[].tool.driver.rules[].properties.tags |= unique' \
            govulncheck.sarif > govulncheck-deduped.sarif
          mv govulncheck-deduped.sarif govulncheck.sarif

      # NOTE: Uploads govulncheck findings to GitHub Code Scanning (Security tab).
      # Skip for fork PRs — GITHUB_TOKEN is read-only there and cannot write
      # to the Security tab. always() ensures we still upload when govulncheck
      # itself exits non-zero (though it's documented to exit 0).
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Skip on release-please PRs: they change only version/changelog, so coverage is
    # unchanged and the comment is noise. Still runs on push to main (badge) and on
    # normal PRs (head_ref is empty on push, so the guard passes there).
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    permissions:
      contents: write # publish the coverage badge to the orphan 'badges' branch (main only)
      pull-requests: write # post the coverage comment on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Same invocation as `make cover`: deterministic in-process unit coverage.
      - name: Generate coverage profile
        run: go test -timeout=5m ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...

      # On PRs, recompute main's coverage live (no stored baseline) so the comment
      # can show the per-file and total delta vs main. Degrades gracefully (the
      # comment simply omits the delta) if main can't be fetched or built.
      - name: Regenerate main baseline (for the PR comment)
        if: github.event_name == 'pull_request'
        run: |
          set +e
          fail() { exit 0; } # no base.breakdown -> the comment script omits the delta
          git fetch --no-tags --depth=1 origin main || fail
          git worktree add --detach /tmp/main FETCH_HEAD || fail
          ( cd /tmp/main && go test -timeout=5m ./... -coverprofile=/tmp/base.out -covermode=atomic -coverpkg=./... ) || fail
          printf 'exclude:\n  paths: ["^cmd/"]\nthreshold: {file: 0, package: 0, total: 0}\n' > /tmp/basegen.yml
          go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 \
            --config=/tmp/basegen.yml --profile=/tmp/base.out \
            --breakdown-file-name="$GITHUB_WORKSPACE/base.breakdown" || fail

      # The PR's own breakdown feeds the comment's per-file table and totals; a
      # failure here is non-fatal (the comment falls back to the raw report).
      - name: Generate PR breakdown (for the PR comment)
        if: github.event_name == 'pull_request'
        run: |
          printf 'profile: cover.out\nexclude:\n  paths: ["^cmd/"]\nthreshold: {file: 0, package: 0, total: 0}\n' > /tmp/prgen.yml
          go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 \
            --config=/tmp/prgen.yml --breakdown-file-name="$GITHUB_WORKSPACE/pr.breakdown" \
            || echo "::warning::PR breakdown generation failed; coverage comment will fall back to the raw report"

      # Enforces .testcoverage.yml (the gate: total/file/overrides -> blocking) and,
      # on main, publishes the badge to the orphan 'badges' branch. git-token is
      # empty on PRs and forks, so nothing is pushed there. The PR delta and per-file
      # table are built by the comment script from the breakdown files, not here.
      - name: Check coverage
        id: coverage
        uses: vladopajic/go-test-coverage@a93b868a4cbcbf18dc3781650fad241f0020e609 # v2.18.8
        with:
          config: ./.testcoverage.yml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      # Build the PR comment from the breakdown files (per-file table + delta) plus
      # the report (gate verdict). See .github/scripts/coverage-comment.sh.
      - name: Build coverage comment
        if: always() && github.event_name == 'pull_request' && steps.coverage.outputs.report != ''
        env:
          REPORT: ${{ fromJSON(steps.coverage.outputs.report) }}
        run: bash .github/scripts/coverage-comment.sh

      - name: Post coverage comment
        if: always() && github.event_name == 'pull_request' && steps.coverage.outputs.report != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-report
          path: cov-comment.md

  setup:
    name: Resolve test versions
    runs-on: ubuntu-latest
    # The integration matrix is redundant on release-please PRs (no code change).
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    outputs:
      vault: ${{ steps.versions.outputs.vault }}
      keycloak: ${{ steps.versions.outputs.keycloak }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # tests/versions.env is the single source of truth shared with the local
      # make targets. Emit the Vault list as JSON for the matrix and the
      # Keycloak pin as a scalar.
      - name: Read tests/versions.env
        id: versions
        run: |
          . ./tests/versions.env
          echo "vault=[\"$VAULT_MPL\",\"$VAULT_1X\",\"$VAULT_2X\"]" >> "$GITHUB_OUTPUT"
          echo "keycloak=$KEYCLOAK" >> "$GITHUB_OUTPUT"

  integration-test:
    name: Integration Tests (Vault ${{ matrix.vault }})
    runs-on: ubuntu-latest
    needs: [build, setup]
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }} # skip on release-please PRs
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        vault: ${{ fromJSON(needs.setup.outputs.vault) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      VAULT_VERSION: ${{ matrix.vault }}
      KEYCLOAK_VERSION: ${{ needs.setup.outputs.keycloak }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.lock

      - name: Install Python dependencies
        run: pip install --require-hashes -r tests/requirements.lock

      - name: Download plugin binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/vault-plugin-secrets-keycloak

      # Pull the exact tags up front so the run uses the current image for each
      # pinned tag regardless of runner cache, and record the resolved digests
      # for the matrix report (and the release validation proof in 6d).
      - name: Pull images and record digests
        run: |
          mkdir -p leg
          vault_image="hashicorp/vault:${VAULT_VERSION}"
          keycloak_image="quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}"
          docker pull "$vault_image"
          docker pull "$keycloak_image"
          vault_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$vault_image" | cut -d@ -f2)"
          keycloak_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$keycloak_image" | cut -d@ -f2)"
          jq -n \
            --arg label "Vault ${VAULT_VERSION}" \
            --arg vi "$vault_image" --arg vd "$vault_digest" \
            --arg ki "$keycloak_image" --arg kd "$keycloak_digest" \
            '{label: $label, vault_image: $vi, vault_digest: $vd, keycloak_image: $ki, keycloak_digest: $kd}' \
            > leg/meta.json

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120 --junit-xml=leg/results.xml

      - name: Upload leg results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-vault-${{ matrix.vault }}
          path: leg/
          retention-days: 7

  integration-report:
    name: Integration matrix report
    runs-on: ubuntu-latest
    needs: integration-test
    # always() so it still reports if a leg fails; skipped on release-please PRs
    # (no matrix ran there).
    if: ${{ always() && !startsWith(github.head_ref, 'release-please--branches--') }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download leg results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-vault-*
          path: all-results

      - name: Build matrix report
        run: |
          python3 .github/scripts/aggregate_results.py all-results \
            --title "Integration matrix" \
            --commit "${GITHUB_SHA}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment with the matrix report
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: integration-test-results
          path: report.md
