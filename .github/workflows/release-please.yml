name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # NOTE: Action refs are pinned to full commit SHAs for supply-chain security.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Build & publish release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for cosign keyless signing (sigstore OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      # NOTE: pinned to full commit SHA for supply-chain security.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-binary .sha256 sidecars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          while IFS='  ' read -r hash binary; do
            printf '%s' "$hash" > "${binary}.sha256"
            gh release upload "$TAG" "${binary}.sha256" --clobber
          done < dist/checksums.txt

      - name: Write SHA256 checksums to job summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "## Release ${TAG} — SHA256 Checksums"
            echo ''
            echo '| Binary | SHA256 |'
            echo '|--------|--------|'
            while IFS='  ' read -r hash binary; do
              echo "| \`${binary}\` | \`${hash}\` |"
            done < dist/checksums.txt
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-release validation: prove the PUBLISHED artifact is authentic (cosign),
  # intact (sha256), and works across the Vault matrix, then attach a signed
  # validation report to the release. Runs only when a release was cut.
  release-verify:
    name: Verify the published release
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vault: ${{ steps.versions.outputs.vault }}
      keycloak: ${{ steps.versions.outputs.keycloak }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Verified against the published v0.2.0 bundle: the signing identity is the
      # release workflow ref (stable across releases); issuer is GitHub OIDC.
      COSIGN_IDENTITY: https://github.com/RoFz/vault-plugin-secrets-keycloak/.github/workflows/release-please.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Resolve test versions
        id: versions
        run: |
          . ./tests/versions.env
          echo "vault=[\"$VAULT_MPL\",\"$VAULT_1X\",\"$VAULT_2X\"]" >> "$GITHUB_OUTPUT"
          echo "keycloak=$KEYCLOAK" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify the published binary
        run: |
          mkdir -p staging verified
          gh release download "$TAG" \
            --pattern '*_linux_amd64' \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.sigstore.json' \
            --dir staging
          cd staging
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity   "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            checksums.txt
          sha256sum -c --ignore-missing checksums.txt
          binary="$(ls ./*_linux_amd64)"
          sha="$(sha256sum "$binary" | cut -d' ' -f1)"
          cp "$binary" ../verified/vault-plugin-secrets-keycloak
          cd ..
          jq -n \
            --arg tag "$TAG" --arg binary "$(basename "$binary")" --arg sha "$sha" \
            --arg id "$COSIGN_IDENTITY" --arg iss "$COSIGN_ISSUER" \
            '{tag: $tag, binary: $binary, sha256: $sha, cosign_verified: true, cosign_identity: $id, cosign_issuer: $iss}' \
            > verified/verification.json

      - name: Upload the verified binary + provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          path: verified/
          retention-days: 7

  release-test:
    name: Integration test (Vault ${{ matrix.vault }})
    needs: [release-please, release-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        vault: ${{ fromJSON(needs.release-verify.outputs.vault) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      VAULT_VERSION: ${{ matrix.vault }}
      KEYCLOAK_VERSION: ${{ needs.release-verify.outputs.keycloak }}

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Download the verified binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verification
          path: verified

      - name: Place the verified binary
        run: |
          mkdir -p bin
          cp verified/vault-plugin-secrets-keycloak bin/vault-plugin-secrets-keycloak
          chmod +x bin/vault-plugin-secrets-keycloak

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.lock

      - name: Install Python dependencies
        run: pip install --require-hashes -r tests/requirements.lock

      - name: Pull images and record digests
        run: |
          mkdir -p leg
          vault_image="hashicorp/vault:${VAULT_VERSION}"
          keycloak_image="quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}"
          docker pull "$vault_image"
          docker pull "$keycloak_image"
          vault_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$vault_image" | cut -d@ -f2)"
          keycloak_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$keycloak_image" | cut -d@ -f2)"
          jq -n \
            --arg label "Vault ${VAULT_VERSION}" \
            --arg vi "$vault_image" --arg vd "$vault_digest" \
            --arg ki "$keycloak_image" --arg kd "$keycloak_digest" \
            '{label: $label, vault_image: $vi, vault_digest: $vd, keycloak_image: $ki, keycloak_digest: $kd}' \
            > leg/meta.json

      - name: Run integration suite against the released binary
        run: pytest tests/integration/ -v --timeout=120 --junit-xml=leg/results.xml

      - name: Upload leg results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-vault-${{ matrix.vault }}
          path: leg/
          retention-days: 7

  release-report:
    name: Release validation report
    needs: [release-please, release-verify, release-test]
    if: always() && needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Download leg results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-vault-*
          path: all-results

      - name: Download provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verification
          path: verified

      - name: Build the validation report
        run: |
          python3 .github/scripts/aggregate_results.py all-results \
            --title "Release validation ${TAG}" \
            --commit "${GITHUB_SHA}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --provenance verified/verification.json \
            --json-out validation-report.json \
            | tee validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the validation report to the release
        run: gh release upload "$TAG" validation-report.md validation-report.json --clobber
