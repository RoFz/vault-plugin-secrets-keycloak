name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  # Run dependency submission first so the snapshot for the PR head SHA is
  # available before the review action queries it. This follows the official
  # GitHub recommendation: run both actions in the same workflow, ordered via
  # needs:. See https://docs.github.com/en/code-security/concepts/supply-chain-security/about-dependency-review#best-practices-for-using-the-dependency-review-api-and-the-dependency-submission-api-together
  dependency-snapshot:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    # Skip for release-please PRs — they only modify CHANGELOG.md and
    # .release-please-manifest.json, never dependency manifests.
    if: "!startsWith(github.head_ref, 'release-please--branches--')"
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Skip for fork PRs — GITHUB_TOKEN is read-only there and cannot submit
      # snapshots to the base repo. dependency-review still runs below.
      - name: Submit Go dependency snapshot
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3

      # Submit Python (pip) dependencies from tests/requirements.txt so that
      # dependency-review can resolve their licenses. Pip detection is
      # experimental in component-detection and must be opted in explicitly.
      - name: Submit Python dependency snapshot
        if: github.event.pull_request.head.repo.fork == false
        uses: advanced-security/component-detection-dependency-submission-action@9c110eb34dee187cd9eca76a652b9f6a0ed22927 # v0.1.1
        with:
          detectorArgs: Pip=EnableIfDefaultOff

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: dependency-snapshot
    if: "!startsWith(github.head_ref, 'release-please--branches--')"
    permissions:
      contents: read
      pull-requests: write

    steps:
      # NOTE: Adopted from HashiCorp vault-workflows-common — action refs are
      # pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
