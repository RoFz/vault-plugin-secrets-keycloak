name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Run every Monday at 07:30 UTC to catch supply-chain freshness issues.
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF to GitHub Security → Code Scanning.
      security-events: write
      # Needed for keyless signing of the Scorecard result via sigstore.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        # NOTE: persist-credentials: false is required by the scorecard action
        # to avoid leaking the GITHUB_TOKEN to the analysis step.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API (public repo only).
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
