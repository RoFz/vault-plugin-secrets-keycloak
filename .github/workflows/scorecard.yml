name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Run every Monday at 07:30 UTC to catch supply-chain freshness issues.
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF to GitHub Security → Code Scanning.
      security-events: write
      # Needed for keyless signing of the Scorecard result via sigstore.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        # NOTE: persist-credentials: false is required by the scorecard action
        # to avoid leaking the GITHUB_TOKEN to the analysis step.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API (public repo only).
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif
