name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Run every Monday at 07:30 UTC to catch supply-chain freshness issues.
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF to GitHub Security → Code Scanning.
      security-events: write
      # Needed for keyless signing of the Scorecard result via sigstore.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        # NOTE: persist-credentials: false is required by the scorecard action
        # to avoid leaking the GITHUB_TOKEN to the analysis step.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API (public repo only).
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
