name: Dependency Snapshot

# Keeps the dependency graph on main current so Dependabot alerts and the
# repository dependency graph reflect the latest merged state.
on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  dependency-snapshot:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Submit dependency snapshot
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
