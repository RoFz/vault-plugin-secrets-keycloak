name: Dependency Snapshot

# Keeps the dependency graph on main current so Dependabot alerts and the
# repository dependency graph reflect the latest merged state.
on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  dependency-snapshot:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Submit dependency snapshot
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
