name: Social Media Announcement

on:
  release:
    types: [published]

permissions: {}

jobs:
  mastodon:
    name: Post to Mastodon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'RoFz/vault-plugin-secrets-keycloak'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the message from the release notes, surfacing the meaningful changes
      # (features + non-dependency-bump fixes) and dropping noise. Mastodon has room
      # for the product description and the full tag set, so it passes both.
      - name: Build message
        id: msg
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          DESC: 'HashiCorp Vault secrets engine for Keycloak. Rotate service account passwords on-demand via the Admin REST API. Cryptographically random, audit-logged, and never stored by Vault.'
          TAGS: '#HashiCorp #Vault #Keycloak #IAM #OpenSource #DevOps #Kubernetes'
        run: |
          {
            echo "message<<MSGEOF"
            bash .github/scripts/social-message.sh 480 desc
            echo "MSGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post
        # NOTE: Pinned to full commit SHA for supply-chain security.
        uses: cbrgm/mastodon-github-action@ac2d8e8c9986a17b824dd12dd9df4ce5fcd813c1 # v2.2.2
        with:
          url: ${{ secrets.MASTODON_URL }}
          access-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          message: ${{ steps.msg.outputs.message }}
          visibility: public

  twitter:
    name: Post to Twitter/X
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'RoFz/vault-plugin-secrets-keycloak'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same builder, tighter 280-char budget and no product description, so the
      # text is spent on the meaningful changes (the release link card carries the
      # full changelog). Defaults to the Twitter description/hashtags in the script.
      - name: Build message
        id: msg
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          {
            echo "message<<MSGEOF"
            bash .github/scripts/social-message.sh 272
            echo "MSGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post
        # NOTE: Pinned to full commit SHA for supply-chain security.
        uses: nearform-actions/github-action-notify-twitter@b3fa623c2f320117e8a08e20564c4ce0a5e67930 # v1.2.3
        with:
          message: ${{ steps.msg.outputs.message }}
          twitter-app-key: ${{ secrets.TWITTER_APP_KEY }}
          twitter-app-secret: ${{ secrets.TWITTER_APP_SECRET }}
          twitter-access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          twitter-access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
