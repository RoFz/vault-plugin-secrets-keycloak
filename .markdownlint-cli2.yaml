# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2

ignores:
  # Auto-generated by release-please — not worth linting.
  - CHANGELOG.md
  - AGENTS.md
  - CLAUDE.md

config:
  # Line length — disabled; prose lines often exceed 80 chars.
  MD013: false
  # First-line h1 — disabled; PR/issue templates intentionally start with h2.
  MD041: false
